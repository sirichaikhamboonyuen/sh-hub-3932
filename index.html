<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SiriHouse Hub</title>
    
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    
    <!-- PWA Links & Configs -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SiriHouse Hub">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0f172a">
    <meta name="robots" content="noindex, nofollow">

    <!-- Google Fonts & Phosphor Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-green: #34d399;
            --error-red: #f87171;
            --badge-lan-bg: rgba(52, 211, 153, 0.15);
            --badge-lan-text: #34d399;
            --badge-ts-bg: rgba(56, 189, 248, 0.15);
            --badge-ts-text: #38bdf8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Prompt', 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.12) 0px, transparent 50%), radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.12) 0px, transparent 50%);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container { width: 100%; max-width: 420px; }
        .glass-card { background: var(--card-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--card-border); border-radius: 28px; padding: 2rem 1.5rem; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3); text-align: center; }
        .header-icon { width: 64px; height: 64px; border-radius: 20px; margin: 0 auto 1rem; display: block; object-fit: contain; box-shadow: 0 8px 16px rgba(2, 132, 199, 0.3); }
        h1 { font-size: 1.4rem; font-weight: 600; margin-bottom: 0.25rem; letter-spacing: -0.5px; }
        .subtitle { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1.25rem; }
        .badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: 500; margin-bottom: 1.5rem; }
        .badge-lan { background-color: var(--badge-lan-bg); color: var(--badge-lan-text); border: 1px solid rgba(52, 211, 153, 0.3); }
        .badge-tailscale { background-color: var(--badge-ts-bg); color: var(--badge-ts-text); border: 1px solid rgba(56, 189, 248, 0.3); }
        .services-grid { display: flex; flex-direction: column; gap: 12px; margin-top: 1rem; text-align: left; }
        .service-card { display: flex; align-items: center; justify-content: space-between; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.05); padding: 14px 16px; border-radius: 16px; text-decoration: none; color: var(--text-main); transition: all 0.2s ease; }
        .service-card:hover { background: rgba(255, 255, 255, 0.08); transform: translateY(-2px); }
        .service-icon { font-size: 22px; color: var(--accent-blue); background: rgba(56, 189, 248, 0.1); padding: 8px; border-radius: 10px; }
        .spinner { width: 44px; height: 44px; border: 3px solid rgba(255, 255, 255, 0.1); border-radius: 50%; border-left-color: var(--accent-blue); animation: spin 1s linear infinite; margin: 1.5rem auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .btn-action { width: 100%; background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%); color: #fff; padding: 14px; border-radius: 14px; font-size: 0.95rem; font-weight: 600; border: none; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; margin-top: 10px; transition: opacity 0.2s ease; }
        .btn-action:active { opacity: 0.8; }
        .btn-retry { background: transparent; color: var(--text-muted); border: 1px solid var(--card-border); }
        .hidden { display: none !important; }
        .app-logo { width: 64px; height: 64px; margin: 0 auto 1rem; display: block; border-radius: 16px; object-fit: contain; }
    </style>
</head>
<body>

<div class="container">
    <div class="glass-card">
        <img src="favicon.png" alt="SiriHouse Logo" class="app-logo">
        <h1>SiriHouse Hub</h1>
        <p class="subtitle">ศูนย์รวมการใช้งานระบบสมาร์ทโฮม SiriHouse</p>

        <div id="checkingState">
            <div class="spinner"></div>
            <p id="statusText" style="font-size: 0.9rem; color: var(--text-muted);">กำลังตรวจสอบเส้นทางเชื่อมต่อ...</p>
        </div>

        <div id="dashboardState" class="hidden">
            <div id="network-badge" class="badge"></div>
            <div class="services-grid">
                <a id="link-router" href="http://192.168.20.1" target="_blank" class="service-card" style="display:none;">
                    <div class="service-info"><i class="ph ph-router service-icon"></i><span class="service-title">ตั้งค่า Router (192.168.20.1)</span></div>
                    <i class="ph ph-caret-right" style="color: var(--text-muted);"></i>
                </a>
                <a id="link-server" href="#" class="service-card">
                    <div class="service-info"><i class="ph ph-cpu service-icon"></i><span class="service-title">เข้าสู่ระบบ SiriHouse Server</span></div>
                    <i class="ph ph-caret-right" style="color: var(--text-muted);"></i>
                </a>
            </div>
        </div>

        <div id="errorState" class="hidden">
            <div class="badge" style="background: rgba(248, 113, 113, 0.15); color: var(--error-red); border: 1px solid rgba(248, 113, 113, 0.3);">❌ ไม่สามารถเชื่อมต่อกับบ้านได้</div>
            <p style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 1.5rem; line-height: 1.5;">ไม่พบการเชื่อมต่อกับบ้านในขณะนี้ครับ 😊 หากอยู่นอกบ้าน กรุณาเปิดแอป Tailscale แล้วลองใหม่อีกครั้ง</p>
            <button onclick="openTailscaleApp()" class="btn-action"><i class="ph ph-shield-check"></i> เปิดแอป Tailscale</button>
            <button onclick="retryCheck()" class="btn-action btn-retry"><i class="ph ph-arrows-clockwise"></i> ลองเชื่อมต่ออีกครั้ง</button>
        </div>
    </div>
</div>

<script>
    // ================= CONFIGURATION =================
    const TAILSCALE_URL = "http://100.118.132.29"; // หรือใช้ "http://sirihouse.tailb30c42.ts.net"
    const LOCAL_LAN_URL = "http://sirihouse.local"; 
    const TIMEOUT_MS = 2500; 
    // =================================================

    // ฟังก์ชันเช็กการเชื่อมต่อแบบผสม (Fetch + Image Fallback) พร้อมระบบ Anti-Cache
    function checkServerAlive(baseUrl) {
        return new Promise((resolve) => {
            const controller = new AbortController();
            let isSettled = false;

            const timer = setTimeout(() => {
                if (!isSettled) {
                    isSettled = true;
                    controller.abort();
                    resolve(false);
                }
            }, TIMEOUT_MS);

            // สร้างพารามิเตอร์สุ่มเพื่อป้องกันเบราว์เซอร์/Service Worker จำค่า Cache
            const cacheBusterUrl = baseUrl + "/favicon.ico?nocache=" + Date.now() + "_" + Math.floor(Math.random() * 100000);

            fetch(cacheBusterUrl, {
                method: 'GET',
                mode: 'no-cors',
                cache: 'no-store',
                signal: controller.signal
            }).then(() => {
                if (!isSettled) {
                    isSettled = true;
                    clearTimeout(timer);
                    resolve(true);
                }
            }).catch(() => {
                // หาก fetch ติดเรื่อง Mixed Content (HTTPS -> HTTP) ให้สลับไปใช้ Image() เป็นสำรอง
                if (!isSettled) {
                    const img = new Image();
                    img.onload = () => {
                        if (!isSettled) {
                            isSettled = true;
                            clearTimeout(timer);
                            resolve(true);
                        }
                    };
                    img.onerror = () => {
                        if (!isSettled) {
                            isSettled = true;
                            clearTimeout(timer);
                            resolve(false);
                        }
                    };
                    img.src = cacheBusterUrl;
                }
            });
        });
    }

    async function checkConnection() {
        const statusText = document.getElementById('statusText');

        // 0. ตรวจสอบว่าอุปกรณ์ต่ออินเทอร์เน็ตอยู่หรือไม่
        if (!navigator.onLine) {
            showErrorState();
            return;
        }

        // 1. เช็กการเชื่อมต่อผ่าน Tailscale
        if (statusText) statusText.innerText = "กำลังตรวจสอบการเชื่อมต่อ Tailscale...";
        const isTailscaleOk = await checkServerAlive(TAILSCALE_URL);
        if (isTailscaleOk) {
            window.location.replace(TAILSCALE_URL);
            return;
        }

        // 2. เช็กการเชื่อมต่อภายในบ้าน (Local LAN)
        if (statusText) statusText.innerText = "กำลังตรวจสอบเครือข่ายภายในบ้าน...";
        const isLocalOk = await checkServerAlive(LOCAL_LAN_URL);
        if (isLocalOk) {
            window.location.replace(LOCAL_LAN_URL);
            return;
        }

        // 3. หากเชื่อมต่อไม่ได้ทั้งสองทาง ให้แสดงหน้า Error
        showErrorState();
    }

    // ฟังก์ชันยิงเช็กสัญญาณใหม่ทันทีที่กดปุ่ม "ลองเชื่อมต่ออีกครั้ง"
    async function retryCheck() {
        const checkingState = document.getElementById('checkingState');
        const errorState = document.getElementById('errorState');
        const statusText = document.getElementById('statusText');

        // สลับไปแสดงสถานะกำลังตรวจสอบ
        if (errorState) errorState.classList.add('hidden');
        if (checkingState) checkingState.classList.remove('hidden');
        if (statusText) statusText.innerText = "กำลังลองเชื่อมต่อใหม่อีกครั้ง...";

        // หน่วงเวลาสั้นๆ 300ms ให้ UI แสดงผล แล้วเช็กสัญญาณสด
        setTimeout(() => {
            checkConnection();
        }, 300);
    }

    function showErrorState() {
        const checkingState = document.getElementById('checkingState');
        const errorState = document.getElementById('errorState');
        if (checkingState) checkingState.classList.add('hidden');
        if (errorState) errorState.classList.remove('hidden');
    }

    function openTailscaleApp() {
        window.location.href = "tailscale://";
        setTimeout(() => { 
            window.open("https://login.tailscale.com/admin/machines", "_blank"); 
        }, 500);
    }

    // ลงทะเบียน Service Worker
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => { 
            navigator.serviceWorker.register('./sw.js').catch(err => console.log(err)); 
        });
    }

    window.addEventListener('DOMContentLoaded', () => { 
        checkConnection(); 
    });
</script>
</body>
</html>
